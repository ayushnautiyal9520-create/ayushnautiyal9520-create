<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 360" width="370" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;display=swap');

      .card-bg {
        fill: #0d1117;
        rx: 12px;
        ry: 12px;
        stroke: #30363d;
        stroke-width: 1.5;
      }
      .window-btn-red { fill: #ff5f56; }
      .window-btn-yellow { fill: #ffbd2e; }
      .window-btn-green { fill: #27c93f; }

      .title-text {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #8b949e;
        font-weight: 500;
      }

      .ascii-row {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 6.8px;
        fill: #8b949e;
        white-space: pre;
        opacity: 0;
        transform: translateX(-4px);
        animation: typeRow 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes typeRow {
        to {
          opacity: 1;
          transform: translateX(0);
          fill: #c9d1d9;
        }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect class="card-bg" width="370" height="360" />

  <!-- Window Header -->
  <circle cx="22" cy="22" r="5.5" class="window-btn-red" />
  <circle cx="38" cy="22" r="5.5" class="window-btn-yellow" />
  <circle cx="54" cy="22" r="5.5" class="window-btn-green" />
  <text x="185" y="26" text-anchor="middle" class="title-text">ayush_portrait.ascii</text>
  <line x1="1" y1="42" x2="369" y2="42" stroke="#21262d" stroke-width="1" />

