<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 380" width="410" height="380">
  <defs>
    <linearGradient id="cyber-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <style>
      .card-bg {
        fill: #090d16;
        rx: 14px;
        ry: 14px;
        stroke: url(#cyber-border);
        stroke-width: 1.8;
      }
      .header-bg {
        fill: #111827;
        rx: 14px;
        ry: 14px;
      }
      .window-btn-red { fill: #f43f5e; }
      .window-btn-yellow { fill: #fbbf24; }
      .window-btn-green { fill: #34d399; }

      .title-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
        font-size: 12px;
        fill: #38bdf8;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .ascii-row {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
        font-size: 9.5px;
        font-weight: 600;
        fill: #38bdf8;
        letter-spacing: 1px;
        white-space: pre;
        opacity: 0;
        transform: translateY(-2px);
        animation: typeRow 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes typeRow {
        to {
          opacity: 1;
          transform: translateY(0);
          fill: #e0f2fe;
        }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect class="card-bg" width="410" height="380" />

  <!-- Window Header -->
  <circle cx="22" cy="24" r="5.5" class="window-btn-red" />
  <circle cx="38" cy="24" r="5.5" class="window-btn-yellow" />
  <circle cx="54" cy="24" r="5.5" class="window-btn-green" />
  <text x="205" y="28" text-anchor="middle" class="title-text">⚡ ayush_portrait.ascii</text>
  <line x1="1" y1="44" x2="409" y2="44" stroke="#1e293b" stroke-width="1.2" />

