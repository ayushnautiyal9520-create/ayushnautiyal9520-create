  <rect x="10" y="13" width="12" height="10" rx="1.5" stroke="#ffffff" stroke-width="1.2" fill="none"/><polyline points="10,14 16,18.5 22,14" stroke="#ffffff" stroke-width="1.2" fill="none"/>
