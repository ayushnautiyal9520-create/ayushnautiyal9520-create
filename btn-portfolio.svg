<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 36" width="250" height="36">
  <style>
    .btn-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .tag-text { font-size: 10px; font-weight: 800; fill: #f8fafc; letter-spacing: 1px; }
    .act-text { font-size: 10px; font-weight: 900; fill: #ffffff; letter-spacing: 0.8px; }
  </style>
  
  <!-- Left Pill (Dark Tag) -->
  <rect x="0" y="0" width="98" height="36" rx="6" fill="#140924" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  <polygon points="16,13 22,23 10,23" fill="#ffffff"/>
  <text x="32" y="22" class="btn-font tag-text">PORTFOLIO</text>

  <!-- Right Pill (Neon Action with ↗) -->
  <g transform="translate(101, 0)">
    <rect x="0" y="0" width="148" height="36" rx="6" fill="#ff5e00" />
    <text x="14" y="22" class="btn-font act-text">GRYVEN.VERCEL.APP</text>
    <!-- Arrow ↗ -->
    <path d="M 128 21 L 136 13 M 130 13 L 136 13 L 136 19" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
